{{- /* Dark theme for the DSCR blog, matched to www.cfcdscr.com (near-black #0a0a0a, cards #141414, gold #b7860b / #ffd900). Contrast (WCAG): text #fff on #141414 18.1:1; gold links #f2c14e 10.5:1; meta #c8c8c8 11:1; button #0a0a0a on #f2c14e 11.9:1. */ -}}
<style>

a{color:#f2c14e}a:hover,a:focus{color:#ffd900}
